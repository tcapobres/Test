<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@nectarbytes | ELIXIR Tracker</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --primary-color: #e31337; 
            --secondary-color: #3498db;
            --border-color: #eaeaea;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            font-size: 1.2rem;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .timestamp {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .details {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .price {
            color: #27ae60;
        }

        .summary-box {
            background: #eef2f3;
            border-left: 5px solid var(--secondary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 20px 0;
        }

        .error-state {
            text-align: center;
            color: var(--primary-color);
            font-weight: bold;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 ELIXIR Market Tracker</h1>
    <p style="text-align: center; margin-top: -10px; color: #7f8c8d;">Tracking Hive-Engine / Tribaldex for @nectarbytes</p>

    <button id="refreshBtn" onclick="fetchAllMarketData()">Refresh Data</button>

    <div class="summary-box" id="summaryBox">
        <span>Total ELIXIR Sold (All-Time):</span>
        <span id="totalSoldSum" style="color: var(--primary-color);">Calculating...</span>
    </div>

    <div class="card">
        <h2>Active Sell Orders (Open Book)</h2>
        <div id="activeOrdersList">
            <div class="empty-state">Loading active orders...</div>
        </div>
    </div>

    <div class="card">
        <h2>Recent Completed Trades (History)</h2>
        <div id="completedTradesList">
            <div class="empty-state">Loading trade history...</div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://api.hive-engine.com/rpc/contracts";
    const ACCOUNT = "nectarbytes";
    const SYMBOL = "ELIXIR";

    function createFetchPayload(table, query, limit = 1000, offset = 0) {
        return {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                jsonrpc: "2.0",
                id: Math.floor(Math.random() * 1000),
                method: "find",
                params: {
                    contract: "market",
                    table: table,
                    query: query,
                    limit: limit,
                    offset: offset,
                    indexes: [{ index: "_id", descending: false }]
                }
            })
        };
    }

    function formatTimestamp(unixTimestamp) {
        const date = new Date(unixTimestamp * 1000);
        return date.toLocaleString(); 
    }

    async function fetchAllMarketData() {
        const btn = document.getElementById('refreshBtn');
        const activeContainer = document.getElementById('activeOrdersList');
        const historyContainer = document.getElementById('completedTradesList');
        const totalSoldSumEl = document.getElementById('totalSoldSum');

        btn.disabled = true;
        btn.textContent = "Fetching All-Time Data...";
        activeContainer.innerHTML = '<div class="empty-state">Fetching active orders...</div>';
        historyContainer.innerHTML = '<div class="empty-state">Fetching trade history...</div>';
        totalSoldSumEl.textContent = "Scanning blocks...";

        try {
            // 1. Fetch Active Sell Orders
            const activeRes = await fetch(API_URL, createFetchPayload("sellBook", { symbol: SYMBOL, account: ACCOUNT }, 100, 0));
            const activeData = await activeRes.json();
            const activeOrders = activeData.result || [];

            // 2. Fetch trade history safely using indexed symbol query and filtering client-side
            let allSales = [];
            let offset = 0;
            let fetchMore = true;
            const limit = 1000;

            while (fetchMore) {
                const historyRes = await fetch(API_URL, createFetchPayload("tradesHistory", { symbol: SYMBOL }, limit, offset));
                const historyData = await historyRes.json();
                const batch = historyData.result || [];

                // Filter client-side for sales belonging strictly to our target account
                const userSales = batch.filter(trade => trade.seller === ACCOUNT);
                allSales = allSales.concat(userSales);

                if (batch.length < limit) {
                    fetchMore = false;
                } else {
                    offset += limit;
                }
            }

            // Calculate total ELIXIR sold to date (all-time)
            const totalSoldQuantity = allSales.reduce((sum, trade) => sum + parseFloat(trade.quantity || 0), 0);
            totalSoldSumEl.textContent = `${totalSoldQuantity.toFixed(3)} ${SYMBOL}`;

            // Render Active Orders
            if (activeOrders.length > 0) {
                activeContainer.innerHTML = activeOrders.map(order => `
                    <div class="order-item">
                        <div class="timestamp">Listed: ${formatTimestamp(order.timestamp)}</div>
                        <div class="details">
                            ${parseFloat(order.quantity).toFixed(3)} ${SYMBOL} @ 
                            <span class="price">${parseFloat(order.price).toFixed(5)} HIVE</span>
                        </div>
                    </div>
                `).join('');
            } else {
                activeContainer.innerHTML = `<div class="empty-state">No active sell orders found for @${ACCOUNT}.</div>`;
            }

            // Render Trade History (sort descending, show top 5 most recent)
            allSales.sort((a, b) => b.timestamp - a.timestamp);
            const topRecentSales = allSales.slice(0, 5);

            if (topRecentSales.length > 0) {
                historyContainer.innerHTML = topRecentSales.map(trade => `
                    <div class="order-item">
                        <div class="timestamp">Sold: ${formatTimestamp(trade.timestamp)}</div>
                        <div class="details">
                            ${parseFloat(trade.quantity).toFixed(3)} ${SYMBOL} @ 
                            <span class="price">${parseFloat(trade.price).toFixed(5)} HIVE</span>
                        </div>
                    </div>
                `).join('');
            } else {
                historyContainer.innerHTML = `<div class="empty-state">No completed sales found for @${ACCOUNT} since token creation.</div>`;
            }

        } catch (error) {
            console.error("API Error:", error);
            activeContainer.innerHTML = `<div class="error-state">Failed to fetch data. Check console.</div>`;
            historyContainer.innerHTML = `<div class="error-state">Failed to fetch data. Check console.</div>`;
            totalSoldSumEl.textContent = "Error";
        } finally {
            btn.disabled = false;
            btn.textContent = "Refresh Data";
        }
    }

    window.onload = fetchAllMarketData;
</script>

</body>
</html>
