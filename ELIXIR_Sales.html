<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hive-Engine Market Transaction Inspector</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="border-b border-slate-800 pb-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-emerald-400">Hive-Engine Transaction Inspector</h1>
                <p class="text-slate-400 text-sm">Robust parser handling nested <code class="bg-slate-900 px-1.5 py-0.5 rounded text-slate-300">contractPayload</code> structures for market actions.</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <input id="accountInput" type="text" placeholder="Enter Hive Account..." class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-emerald-500 w-full md:w-64">
                <button onclick="fetchHistory()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition shadow-lg shadow-emerald-950">Fetch</button>
                <button onclick="loadSampleData()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-4 py-2 rounded-lg text-sm transition border border-slate-700">Load Samples</button>
            </div>
        </header>

        <!-- Status / Notice -->
        <div id="statusMessage" class="hidden bg-slate-900 border border-slate-800 p-4 rounded-xl text-sm text-slate-300"></div>

        <!-- Table Container -->
        <div class="bg-slate-900/50 border border-slate-800 rounded-2xl overflow-hidden shadow-xl backdrop-blur-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-900 text-slate-400 border-b border-slate-800 uppercase tracking-wider text-xs">
                            <th class="p-4">Timestamp</th>
                            <th class="p-4">Contract / Action</th>
                            <th class="p-4">Quantity</th>
                            <th class="p-4">Symbol</th>
                            <th class="p-4">Price</th>
                            <th class="p-4 text-right">Raw Data</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTableBody" class="divide-y divide-slate-800/60">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-500">No transactions loaded. Enter an account or click "Load Samples" to begin.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Raw JSON Modal -->
    <div id="jsonModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[80vh]">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                <h3 class="font-semibold text-slate-200">Raw Transaction Object</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
            </div>
            <div class="p-4 overflow-auto flex-1 bg-slate-950/50">
                <pre id="modalJsonContent" class="text-xs text-emerald-400 font-mono whitespace-pre-wrap"></pre>
            </div>
            <div class="p-4 border-t border-slate-800 bg-slate-950 text-right">
                <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm transition">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Comprehensive fallback extraction logic
        function parseTransaction(tx) {
            const action = tx.contractAction || tx.action || tx.operation || 'unknown';
            const contract = tx.contractName || tx.contract || 'tokens';

            // 1. Exhaustive Quantity Extraction (Checks root and nested payloads across naming conventions)
            let quantity = 0;
            const qtyCandidates = [
                tx.quantity,
                tx.qty,
                tx.amount,
                tx.contractPayload?.quantity,
                tx.contractPayload?.qty,
                tx.contractPayload?.amount,
                tx.contractPayload?.tokens,
                tx.payload?.quantity,
                tx.payload?.qty
            ];
            for (let val of qtyCandidates) {
                if (val !== undefined && val !== null && val !== '') {
                    const parsed = parseFloat(val);
                    if (!isNaN(parsed)) {
                        quantity = parsed;
                        break;
                    }
                }
            }

            // 2. Exhaustive Symbol Extraction
            let symbol = '';
            const symbolCandidates = [
                tx.symbol,
                tx.contractPayload?.symbol,
                tx.payload?.symbol,
                tx.contractPayload?.token,
                tx.token
            ];
            for (let val of symbolCandidates) {
                if (val && typeof val === 'string') {
                    symbol = val;
                    break;
                }
            }

            // 3. Exhaustive Price Extraction
            let price = 0;
            const priceCandidates = [
                tx.price,
                tx.contractPayload?.price,
                tx.payload?.price
            ];
            for (let val of priceCandidates) {
                if (val !== undefined && val !== null && val !== '') {
                    const parsed = parseFloat(val);
                    if (!isNaN(parsed)) {
                        price = parsed;
                        break;
                    }
                }
            }

            // Format timestamp safely
            let timestamp = 'N/A';
            if (tx.timestamp) {
                const d = typeof tx.timestamp === 'number' ? new Date(tx.timestamp * 1000) : new Date(tx.timestamp);
                timestamp = isNaN(d.getTime()) ? tx.timestamp : d.toLocaleString();
            } else if (tx.blockNumber) {
                timestamp = `Block #${tx.blockNumber}`;
            }

            return { timestamp, contract, action, quantity, symbol, price, raw: tx };
        }

        function renderTable(transactions) {
            const tbody = document.getElementById('transactionTableBody');
            if (!transactions || transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">No transactions found.</td></tr>`;
                return;
            }

            tbody.innerHTML = transactions.map((rawTx, index) => {
                const tx = parseTransaction(rawTx);
                
                // Badge color based on action type
                let badgeColor = 'bg-slate-800 text-slate-300 border-slate-700';
                if (tx.action.includes('sell')) badgeColor = 'bg-rose-950/60 text-rose-400 border-rose-900/50';
                if (tx.action.includes('buy')) badgeColor = 'bg-emerald-950/60 text-emerald-400 border-emerald-900/50';
                if (tx.action.includes('transfer')) badgeColor = 'bg-sky-950/60 text-sky-400 border-sky-900/50';

                return `
                    <tr class="hover:bg-slate-900/80 transition">
                        <td class="p-4 text-slate-300 whitespace-nowrap">${tx.timestamp}</td>
                        <td class="p-4">
                            <div class="font-medium text-slate-200">${tx.contract}</div>
                            <span class="inline-block mt-1 px-2 py-0.5 rounded text-xs border ${badgeColor}">${tx.action}</span>
                        </td>
                        <td class="p-4 font-mono font-semibold text-slate-100">${tx.quantity.toLocaleString()}</td>
                        <td class="p-4 font-mono text-emerald-400 font-medium">${tx.symbol || '-'}</td>
                        <td class="p-4 font-mono text-slate-400">${tx.price ? tx.price.toFixed(8) : '-'}</td>
                        <td class="p-4 text-right">
                            <button onclick='openModal(${index})' class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded text-xs transition border border-slate-700">JSON</button>
                        </td>
                    </tr>
                `;
            }).join('');

            // Store raw transactions globally for modal viewing
            window.currentTransactions = transactions;
        }

        async function fetchHistory() {
            const account = document.getElementById('accountInput').value.trim();
            const statusDiv = document.getElementById('statusMessage');
            
            if (!account) {
                statusDiv.textContent = 'Please enter a valid Hive account name.';
                statusDiv.classList.remove('hidden');
                return;
            }

            statusDiv.textContent = `Fetching history for @${account}...`;
            statusDiv.classList.remove('hidden');

            try {
                // Public Hive-Engine history endpoint
                const response = await fetch(`https://history.hive-engine.com/accountHistory?account=${account}&limit=50`);
                const data = await response.json();
                
                statusDiv.textContent = `Successfully loaded ${data.length} transactions for @${account}.`;
                renderTable(data);
            } catch (err) {
                console.error(err);
                statusDiv.textContent = 'Error fetching history. Check console or try loading sample data.';
            }
        }

        function loadSampleData() {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = 'Loaded mock test data containing nested market contract structures.';
            statusDiv.classList.remove('hidden');

            const sampleData = [
                {
                    timestamp: 1774870000,
                    contractName: "market",
                    contractAction: "marketSell",
                    contractPayload: {
                        symbol: "DEC",
                        quantity: "2540.50000000"
                    }
                },
                {
                    timestamp: 1774869500,
                    contractName: "market",
                    contractAction: "sell",
                    contractPayload: {
                        symbol: "SWAP.HIVE",
                        quantity: "15.00000000",
                        price: "0.24500000"
                    }
                },
                {
                    timestamp: 1774868000,
                    contractName: "tokens",
                    contractAction: "transfer",
                    quantity: "100.000000",
                    symbol: "BEE"
                },
                {
                    timestamp: 1774865000,
                    contractName: "market",
                    contractAction: "marketBuy",
                    contractPayload: {
                        symbol: "SPT",
                        quantity: "5000"
                    }
                }
            ];

            renderTable(sampleData);
        }

        function openModal(index) {
            const tx = window.currentTransactions[index];
            document.getElementById('modalJsonContent').textContent = JSON.stringify(tx, null, 2);
            document.getElementById('jsonModal').classList.remove('hidden');
            document.getElementById('jsonModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('jsonModal').classList.add('hidden');
            document.getElementById('jsonModal').classList.remove('flex');
        }
    </script>
</body>
</html>
