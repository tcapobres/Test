<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELIXIR Definitive Ledger</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com
/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for in-browser JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Simple helper components for Lucide icons in a standalone environment
    const RefreshCcw = (props) => <i data-lucide="refresh-ccw" {...props}></i>;
    const AlertCircle = (props) => <i data-lucide="alert-circle" {...props}></i>;
    const Database = (props) => <i data-lucide="database" {...props}></i>;
    const Coins = (props) => <i data-lucide="coins" {...props}></i>;
    const BarChart3 = (props) => <i data-lucide="bar-chart-3" {...props}></i>;
    const History = (props) => <i data-lucide="history" {...props}></i>;
    const CheckCircle2 = (props) => <i data-lucide="check-circle-2" {...props}></i>;
    const Search = (props) => <i data-lucide="search" {...props}></i>;
    const Gift = (props) => <i data-lucide="gift" {...props}></i>;

    // Buyer history is cached outside the component so pressing "Audit Supply"
    // again does not hammer the history node with the same requests.
    const historyCache = new Map();

    function App() {
      const [data, setData] = useState({
        history: [],
        pricePoints: [],
        richList: []
      });
      const [stats, setStats] = useState({
        totalPublicHeld: 0,
        totalTracedMarket: 0,
        totalReconstructed: 0,
        totalRewards: 0,
        totalCalculatedSold: 0
      });
      const [quality, setQuality] = useState(null);
      const [loading, setLoading] = 
useState(true);
      const [loadingMsg, setLoadingMsg] = useState('Initializing...');
      const [error, setError] = useState(null);

      const SELLER_ACCOUNT = 'nectarbytes';
      const SYMBOL = 'ELIXIR';
      const TRANCHE_1_PRICE = 1.0;

      // The Hive Engine history node hard-caps every response at 500 rows no matter
      // what `limit` you ask for. Requesting 1000 silently truncates the result
      // set to 500, which is what caused older (and smaller) sales to vanish.
      const HISTORY_PAGE_SIZE = 500;
      const RPC_PAGE_SIZE = 1000;
      const MAX_HISTORY_PAGES = 400;
      const CROSS_CHECK_CONCURRENCY = 3;
      const CROSS_CHECK_RETRIES = 4;
      const EPSILON = 0.000001;

      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      // Helper: Fetch JSON with automatic multi-node fallback for Hive-Engine RPC
      const fetchRpcWithFallback = async (bodyPayload) => {
        const nodes = [
          'https://api.hive-engine.com/rpc/contracts',
          'https://herpc.dtools.dev/contracts',
          'https://api.primersion.com/contracts'
        ];
        for (const url of nodes) {
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(bodyPayload),
            });
            if (!response.ok) continue;
            const json = await response.json();
            if (json && Array.isArray(json.result)) {
              return json.result;
            }
          } catch (e) {
            console.warn(`RPC node failed (${url}), trying next...`, e);
          }
        }
        return [];
      };

      // Helper: Fetch History Node with multi-node fallback + retry.
      // The node rate-limits bursts and answers with a CORS/network failure rather
      // than an HTTP error, so failures must be retried instead of swallowed.
      const fetchHistoryWithFallback = async (queryString, attempt = 0) => {
        const nodes = [
          'https://history.hive-engine.com/accountHistory',
          'https://accounts.hive-engine.com/accountHistory'
        ];
        for (const baseUrl of nodes) {
          try {
            const res = await fetch(`${baseUrl}?${queryString}`);
            if (!res.ok) {
              console.warn(`History node ${baseUrl} returned ${res.status}, trying next...`);
              continue;
            }
            const json = await res.json();
            if (Array.isArray(json)) {
              return json;
            }
          } catch (e) {
            console.warn(`History node failed (${baseUrl}), trying next...`, 
e);
          }
        }
        if (attempt < CROSS_CHECK_RETRIES - 1) {
          await sleep(500 * (attempt + 1) * (attempt + 1));
          return fetchHistoryWithFallback(queryString, attempt + 1);
        }
        console.error(`History request permanently failed: ${queryString}`);
        return null;
      };

      // Runs `worker` over `items` 
with a bounded number of concurrent requests.
      // Firing 40+ history calls at once is what tripped the node's rate limiter.
      const mapWithConcurrency = async (items, limit, worker) => {
        const results = new Array(items.length);
        let cursor = 0;
        const runners = Array.from({ length: Math.max(1, Math.min(limit, items.length)) }, async () => {
          while (cursor < items.length) {
            const index = cursor++;
            try {
              results[index] = await 
worker(items[index], index);
            } catch (err) {
              results[index] = { error: err };
            }
          }
        });
        await Promise.all(runners);
        return results;
      };

      // Market ops (market_sell / market_buy) report the token amount as
      // `quantityTokens`; transfers report it as `quantity`. Reading the wrong
      // field silently yields 0 and 
drops the row.
      const extractQty = (record) => {
        const op = String(record.operation || '').toLowerCase();
        const isMarket = op === 'market_sell' || op === 'market_buy';
        const keys = isMarket ? ['quantityTokens', 'quantity'] : ['quantity', 'quantityTokens'];
        for (const key of keys) {
          const raw = record[key];
          if (raw === undefined || raw === null || raw === '') continue;
          const num = parseFloat(raw);
          if (!isNaN(num)) return num;
        }
        return 0;
      };

      // Market ops carry no `price` field. The node reports the Hive leg as
      // `quantityHive`, so the real price is quantityHive / quantityTokens.
      // Falling back to a flat 1.0 HIVE mislabelled every 2.0 HIVE tranche.
      const derivePrice = (record, qty) => {
        if (record.price !== undefined && record.price !== null && record.price !== '') {
          const p = parseFloat(record.price);
          if (!isNaN(p) && p > 0) return p;
        }
        if (record.quantityHive !== undefined && record.quantityHive !== null && qty > 0) {
          const hive = parseFloat(record.quantityHive);
          if (!isNaN(hive) && hive > 0) {
            const p = hive / qty;
            if (p > 0) return p;
          }
        }
        return TRANCHE_1_PRICE;
      };

      const txIdsOf = (record) => {
        const ids = [];
        if (record.transactionId) ids.push(record.transactionId);
        if (record.sellTxId) ids.push(record.sellTxId);
        if (record.buyTxId) ids.push(record.buyTxId);
        return ids;
      };

      // 1. Fetch exact current balances (Liquid + Staked)
      const fetchRichList = async () => {
        let allBalances = [];
        let offset = 0;
        let hasMore = true;

        while (hasMore) {
          const records = await fetchRpcWithFallback({
            jsonrpc: '2.0',
            id: 1,
            method: 'find',
            params: { contract: 'tokens', table: 'balances', query: { symbol: SYMBOL }, limit: RPC_PAGE_SIZE, offset },
          });
          allBalances = [...allBalances, ...records];
          if (records.length < RPC_PAGE_SIZE) hasMore = false;
          else offset += RPC_PAGE_SIZE;
        }

        return allBalances
          .filter(b => b.account !== SELLER_ACCOUNT && b.account !== 'null')
          .map(b => ({
            account: String(b.account || '').toLowerCase(),
            liquid: parseFloat(b.balance || 0),
            staked: parseFloat(b.stake || 0),
            pending: parseFloat(b.pendingUnstake || 0),
            total: parseFloat(b.balance || 0) + parseFloat(b.stake || 0) + parseFloat(b.pendingUnstake || 0)
          }))
          .filter(b => b.total > 0);
      };

      // 2. Fetch all unpruned RPC market trades filtered directly by seller
      const fetchRecentTrades = async () => {
        let allTrades = [];
        let offset = 0;
        let hasMore = true;

        while (hasMore) {
          const records = await fetchRpcWithFallback({
            jsonrpc: '2.0',
            id: 1,
            method: 'find',
            params: {
              contract: 'market',
              table: 'tradesHistory',
              query: { symbol: SYMBOL, seller: SELLER_ACCOUNT },
              limit: RPC_PAGE_SIZE,
              offset
            },
          });
          allTrades = [...allTrades, ...records];
          if (records.length < RPC_PAGE_SIZE) hasMore = false;
          else offset += RPC_PAGE_SIZE;
        }

        return allTrades;
      };

      // 3. Fetch the seller's full history node history.
      //    Paginate until an EMPTY page comes back, advancing the offset by the
      //    number of rows actually received. Breaking on a short page is what
      //    silently dropped the second half of the ledger.
      const fetchAccountHistory = async (account) => {
        if (historyCache.has(account)) return historyCache.get(account);

        const records = [];
        const seen = new Set();
        let offset = 0;
        let pages = 0;
        let failed = false;

        while (pages < MAX_HISTORY_PAGES) {
          const data = await fetchHistoryWithFallback(
            `account=${account}&symbol=${SYMBOL}&limit=${HISTORY_PAGE_SIZE}&offset=${offset}`
          );
          if (data === null) {
            failed = true;
            break;
          }
          if (data.length === 0) break;

          let added = 0;
          for (const rec of data) {
            const id = rec._id || `${rec.timestamp}_${rec.operation}_${rec.transactionId}`;
            if (seen.has(id)) continue;
            seen.add(id);
            records.push(rec);
            added++;
          }
          pages++;
          offset += data.length;
          if (data.length < HISTORY_PAGE_SIZE && added === 0) break;
        }

        const result = { records, 
failed };
        if (!failed) historyCache.set(account, result);
        return result;
      };

      const processData = async () => {
        setLoading(true);
        setError(null);
        setLoadingMsg('Fetching Rich List, RPC Market Trades, and Deep History concurrently...');

        try {
          const [richListRaw, recentTrades, sellerHistory] = await Promise.all([
            fetchRichList(),
            fetchRecentTrades(),
            fetchAccountHistory(SELLER_ACCOUNT)
          ]);
          const deepHistory = sellerHistory.records;
          const sellerHistoryFailed = sellerHistory.failed;

          setLoadingMsg('Reconciling ledgers and mathematically verifying supply...');

          const sellerLower = SELLER_ACCOUNT.toLowerCase();

          const richList = richListRaw.map(user => {
            // A 50 ELIXIR "Test" transfer was made to bulliontools. It is not a
            // sale, so it is excluded from the ledger and from the balance used
            // for reconciliation. (Previously this rule also deleted two real
            // 50 ELIXIR market sales to bulliontools.)
            if (user.account === 'bulliontools') {
              return { ...user, total: Math.max(0, user.total - 50) };
            }
            return user;
          }).filter(user => user.total > 0);

          const ledgerMap = new Map();
          let totalPublicHeld = 0;

          richList.forEach(user => {
            totalPublicHeld += user.total;
          });

          // Index all RPC trades first (exact buyer, quantity, price, and timestamp)
          recentTrades.forEach((trade, idx) => {
            const buyer = String(trade.buyer || '').toLowerCase();
            const qty = parseFloat(trade.quantity || 0);
            const price = 
parseFloat(trade.price || 0);
            const timestamp = Number(trade.timestamp || 0);
            const key = `RPC_${buyer}_${qty.toFixed(6)}_${timestamp}_${trade._id || idx}`;

            ledgerMap.set(key, {
              id: key,
              date: new Date(timestamp * 1000).toLocaleString(),
              timestamp: timestamp,
              type: 'BUY (RPC)',
              buyer: buyer,
              seller: SELLER_ACCOUNT,
              quantity: qty,
              price: price,
              totalHive: qty * price,
              source: 'RPC Market',
              memo: 'Order Book Fill',
              txIds: txIdsOf(trade)
            });
          });

          // Merge History Node transfers and market sells
          deepHistory.forEach((record, idx) => {
            const op = String(record.operation || '').toLowerCase();
            const isTransferType = op.includes('transfer') || op.includes('issue');
            const isMarketType = op === 'market_sell';

            const accountUser = String(record.account || '').toLowerCase();
            const fromUser = String(record.from || record.sender || accountUser || '').toLowerCase();
            const toUser = String(record.to || record.receiver || record.buyer || '').toLowerCase();
            const qty = extractQty(record);
            const timestamp = Number(record.timestamp || 0);
            const memo = record.memo || '';

            // The "Test" transfer is a plain transfer, never a market sale.
            if (
              isTransferType &&
              memo.trim().toLowerCase() === 'test' &&
              Math.abs(qty - 50) < EPSILON &&
              (fromUser === 'bulliontools' || toUser === 'bulliontools')
            ) {
              return;
            }

            const isOutbound = fromUser === sellerLower || accountUser === sellerLower;

            if (isTransferType && isOutbound && toUser && toUser !== sellerLower && qty > 0) {
              const key = `DELEG_${toUser}_${qty.toFixed(6)}_${timestamp}_${idx}`;
              ledgerMap.set(key, {
                id: key,
                date: new Date(timestamp * 1000).toLocaleString(),
                timestamp: timestamp,
                type: 'DELEGATION PAYMENT',
                buyer: toUser,
                seller: SELLER_ACCOUNT,
                quantity: qty,
                price: 0,
                totalHive: 0,
                source: 'Blockchain Transfer',
                memo: memo ? `Transfer: ${memo}` : 'Delegation Payment (No Memo)',
                txIds: txIdsOf(record)
              });
            }

            if (isMarketType && isOutbound && qty > 0) {
              const price = derivePrice(record, qty);

              // Duplicate check against the RPC copy of the same fill.
              const recordTxIds = 
txIdsOf(record);
              let isDuplicate = false;
              for (let val of ledgerMap.values()) {
                if (val.source !== 'RPC Market') continue;
                const sameBuyer = !toUser || val.buyer === toUser;
                const sameQty = Math.abs(val.quantity - qty) < EPSILON;
                const sameTime = Math.abs(val.timestamp - timestamp) <= 120;
                const sameTx = recordTxIds.length > 0 && val.txIds && recordTxIds.some(t => val.txIds.includes(t));
                if ((sameTx || (sameBuyer && sameQty && sameTime))) {
                  isDuplicate = true;
                  break;
                }
              }

              if (!isDuplicate) {
                const key = `HIST_${toUser || 'unknown'}_${qty.toFixed(6)}_${timestamp}_${idx}`;
                ledgerMap.set(key, {
                  id: key,
                  date: new Date(timestamp * 1000).toLocaleString(),
                  timestamp: timestamp,
                  type: 'BUY (HIST)',
                  buyer: toUser || 'UNKNOWN',
                  seller: SELLER_ACCOUNT,
                  quantity: qty,
                  price: price,
                  totalHive: qty * price,
                  source: 'History Node',
                  memo: 'Order Book Match',
                  txIds: recordTxIds
                });
              }
            }
          });

          // Track traced balances per account
          const tracedByAccount = {};
          ledgerMap.forEach(trade => {
            if (trade.buyer && trade.buyer !== 'UNKNOWN') {
              if (!tracedByAccount[trade.buyer]) tracedByAccount[trade.buyer] = 0;
              tracedByAccount[trade.buyer] += trade.quantity;
            }
          });

          // Cross-check every account that appears in the seller's history OR in
          // the rich list, including accounts whose balance is now 0 
(they sold
          // or moved on, so a balance-based reconciliation can never recover
          // them). Their own history still proves the sale happened.
          const candidateAccounts = new Set();
          deepHistory.forEach(record => {
            if (String(record.operation || '').toLowerCase() !== 'market_sell') return;
            const buyer = String(record.to || '').toLowerCase();
            if (buyer) candidateAccounts.add(buyer);
          });
          richList.forEach(user => candidateAccounts.add(user.account));

          setLoadingMsg(`Cross-checking ${candidateAccounts.size} account histories for unindexed sells...`);

          const otherSellerInflow = {};
          let crossCheckFailed = 0;
          let recoveredByCrossCheck = 0;

          const checkAccount = async (account) => {
            const { records, failed } = await 
fetchAccountHistory(account);
            if (failed) return { account, failed: true, buys: [], otherIn: 0 };

            const buys = [];
            let otherIn = 0;

            (records || []).forEach(rec => {
              const op = String(rec.operation || '').toLowerCase();
              const qty = extractQty(rec);
              if (qty <= 0) return;

              if (op === 'market_buy') {
                const from = String(rec.from || 
'').toLowerCase();
                if (from === sellerLower) {
                  buys.push({
                    qty: qty,
                    timestamp: Number(rec.timestamp || 0),
                    price: derivePrice(rec, qty),
                    txIds: txIdsOf(rec)
                  });
                } else {
                  // Bought from somebody else - not a nectarbytes sale.
                  otherIn += qty;
                }
              } else if (op.includes('transfer')) {
                const to = String(rec.to || 
'').toLowerCase();
                const from = String(rec.from || '').toLowerCase();
                if (to === account && from && from !== sellerLower) {
                  otherIn += qty;
                }
              }
            });

            return { account, failed: false, buys, otherIn };
          };

          const accountList = Array.from(candidateAccounts);
          const crossCheckResults = 
await mapWithConcurrency(
            accountList,
            CROSS_CHECK_CONCURRENCY,
            checkAccount
          );

          // The history node throttles bursts, so a couple of parallel requests
          // can still come back empty-handed. Retry those one at a time instead
          // of silently dropping the account.
          for (let i = 0; i < crossCheckResults.length; i++) {
            const res = 
crossCheckResults[i];
            if (res && !res.failed && !res.error) continue;
            await sleep(750);
            try {
              crossCheckResults[i] = await checkAccount(res && res.account ? res.account : accountList[i]);
            } catch (err) {
              crossCheckResults[i] = { account: accountList[i], failed: true, buys: [], otherIn: 0 };
            }
          }

          crossCheckResults.forEach(result 
=> {
            if (!result || result.error || result.failed) {
              crossCheckFailed++;
              return;
            }

            if (result.otherIn > 0) {
              otherSellerInflow[result.account] = (otherSellerInflow[result.account] || 0) + result.otherIn;
            }

            result.buys.forEach((buy, bIdx) => {
              let alreadyExists = false;
              for (const val of 
ledgerMap.values()) {
                if (!val.type.startsWith('BUY')) continue;
                const sameTx = buy.txIds.length > 0 && val.txIds && buy.txIds.some(t => val.txIds.includes(t));
                const sameBuyer = val.buyer === result.account;
                const sameQty = Math.abs(val.quantity - buy.qty) < EPSILON;
                const sameTime = Math.abs(val.timestamp - buy.timestamp) <= 2;
                if (sameTx || (sameBuyer && sameQty && sameTime)) {
                  alreadyExists = true;
                  break;
                }
              }

              if (!alreadyExists) {
                const key = `BUYER_${result.account}_${buy.qty.toFixed(6)}_${buy.timestamp}_${bIdx}`;
                ledgerMap.set(key, {
                  id: key,
                  date: new Date(buy.timestamp * 1000).toLocaleString(),
                  timestamp: buy.timestamp,
                  type: 'BUY (HIST)',
                  buyer: result.account,
                  seller: SELLER_ACCOUNT,
                  quantity: buy.qty,
                  price: buy.price,
                  totalHive: buy.qty * buy.price,
                  source: 'Buyer History Node',
                  memo: 'Order Book Fill (Buyer Verified)',
                  txIds: buy.txIds
                });
                recoveredByCrossCheck++;
                tracedByAccount[result.account] = (tracedByAccount[result.account] || 0) + buy.qty;
              }
            });
          });

          // Reconcile what each holder still owns against what we can prove
          // they received from nectarbytes. Tokens that arrived from another
          // seller are subtracted first so they are not miscounted as sales.
          let totalReconstructed = 0;
          let unverifiedAccounts = 0;

          richList.forEach(user => {
            const trueBalance = user.total;
            const tracedBalance = 
tracedByAccount[user.account] || 0;
            const otherIn = otherSellerInflow[user.account] || 0;
            const verified = crossCheckResults.some(r => r && !r.error && !r.failed && r.account === user.account);
            if (!verified) unverifiedAccounts++;

            const gap = trueBalance - tracedBalance - otherIn;

            if (gap > EPSILON) {
              totalReconstructed += gap;

              const key = `RECON_${user.account}_${gap.toFixed(6)}`;
              ledgerMap.set(key, {
                id: key,
                date: 'Historical (Pruned by API)',
                timestamp: 0,
                type: 'BUY (RECONSTRUCTED)',
                buyer: user.account,
                seller: SELLER_ACCOUNT,
                quantity: gap,
                price: TRANCHE_1_PRICE,
                totalHive: gap * TRANCHE_1_PRICE,
                source: 'Rich List Reconciliation',
                memo: verified
                  ? 'Pruned by Node (Assumed Sale)'
                  : 'Pruned by Node (Assumed Sale, Account Unverified)',
                txIds: []
              });
            }
          });

          const finalLedger = Array.from(ledgerMap.values());
          const priceMap = {};
          let totalTracedMarket = 0;
          let totalRewards = 0;

          finalLedger.forEach(row => {
            if (row.price > 0) {
              // Hive Engine reports the Hive leg including the taker fee, so the
              // effective price of a 2.0 HIVE fill lands on 2.00000002 and so on.
              // Group the tranche chart by the rounded price, otherwise the fee
              // jitter shatters every tier into a dozen near-identical cards.
              const p = row.price.toFixed(4);
              if (!priceMap[p]) priceMap[p] = 0;
              priceMap[p] += row.quantity;
            }

            if (row.type === 'DELEGATION PAYMENT') {
              totalRewards += row.quantity;
            } else if (row.source !== 'Rich List Reconciliation') {
              totalTracedMarket += row.quantity;
            }
          });

          finalLedger.sort((a, b) => b.timestamp - a.timestamp);

          setData({
            history: finalLedger,
            pricePoints: Object.entries(
priceMap).map(([price, amount]) => ({ price, amount })).sort((a,b) => parseFloat(a.price) - parseFloat(b.price)),
            richList: richList
          });

          setStats({
            totalPublicHeld,
            totalTracedMarket,
            totalReconstructed,
            totalRewards,
            totalCalculatedSold: totalTracedMarket + totalReconstructed
          });

          setQuality({
            historyRecords: deepHistory.length,
            sellerHistoryFailed,
            accountsChecked: candidateAccounts.size,
            crossCheckFailed,
            recoveredByCrossCheck,
            unverifiedAccounts,
            otherSellerInflowTotal: Object.values(otherSellerInflow).reduce((a, b) => a + b, 0)
          });

        } catch (err) {
          console.error(err);
          setError(err.message || 'Failed to aggregate data.');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        processData();
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [loading, data]);

      const StatCard = ({ title, value, subtext, icon: IconComponent, colorClass, highlight = false }) => (
        <div className={`bg-slate-800 p-6 rounded-xl border ${highlight ? 'border-amber-500/50 shadow-[0_0_15px_rgba(245,158,11,0.15)]' : 'border-slate-700'} flex flex-col justify-between`}>
          <div className="flex justify-between items-start mb-4">
            <h3 className="text-slate-400 font-medium text-sm">{title}</h3>
            <div className={`p-2 rounded-lg bg-slate-900/50 ${colorClass}`}>
              <IconComponent className="w-5 h-5" />
            </div>
          </div>
          <div>
            <div className={`text-3xl font-bold ${colorClass} mb-1`}>
              {value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 6 })}
            </div>
            {subtext && <div className="text-xs text-slate-500">{subtext}</div>}
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-slate-900 text-slate-200 p-6 
font-sans">
          <div className="max-w-6xl mx-auto space-y-6">

            <header className="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
              <div>
                <h1 className="text-3xl font-bold text-white flex items-center gap-2">
                  <CheckCircle2 className="text-emerald-500" />
                  ELIXIR Definitive Ledger
                </h1>
                <p className="text-slate-400 text-sm mt-1">Cross-referencing APIs with Staked/Liquid Rich List to reconstruct pruned data</p>
              </div>

              <button
                onClick={processData}
                disabled={loading}
                className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed font-medium"
              >
                <RefreshCcw className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`} />
                {loading ? 'Reconciling...' : 'Audit Supply'}
              </button>
            </header>

            {error && (
              <div className="bg-red-900/50 border border-red-500 text-red-200 p-4 rounded-lg flex items-center gap-3">
                <AlertCircle className="w-5 h-5 flex-shrink-0" />
                <p>{error}</p>
              </div>
            )}

            {loading ? (
              <div className="flex flex-col items-center justify-center p-20 bg-slate-800 rounded-xl border border-slate-700">
                <Search className="w-10 h-10 text-emerald-500 animate-pulse mb-4" />
                <p className="text-lg text-slate-300 font-medium">{loadingMsg}</p>
              </div>
            ) : (
              <>
                {quality && (
                  <div className="bg-slate-800/60 border border-slate-700 rounded-lg px-4 py-3 text-xs text-slate-400 flex flex-wrap gap-x-6 gap-y-1">
                    <span><span className="text-slate-200 font-semibold">{quality.historyRecords}</span> seller history records indexed</span>
                    <span><span className="text-slate-200 font-semibold">{quality.accountsChecked}</span> account histories cross-checked</span>
                    <span><span className="text-slate-200 
font-semibold">{quality.recoveredByCrossCheck}</span> sales recovered via buyer history</span>
                    <span><span className="text-slate-200 font-semibold">{quality.otherSellerInflowTotal.toFixed(6)}</span> ELIXIR excluded (bought from other sellers)</span>
                    {quality.crossCheckFailed > 0 && (
                      <span className="text-amber-400"><span className="font-semibold">{quality.crossCheckFailed}</span> account histories failed to load</span>
                    )}
                    
{quality.sellerHistoryFailed && (
                      <span className="text-red-400"><span className="font-semibold">Seller history failed to load</span> - ledger may be incomplete</span>
                    )}
                  </div>
                )}

                <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                  <StatCard
                    title="Public Supply"
                    value={stats.totalPublicHeld}
                    subtext="Liquid + Staked + Pending"
                    icon={Database}
                    colorClass="text-indigo-400"
                  />
                  <StatCard
                    title="Delegation Payments"
                    value={stats.totalRewards}
                    subtext="Direct transfers / airdrops"
                    icon={Gift}
                    colorClass="text-purple-400"
                  />
                  <StatCard
                    title="Traced Market Sells"
                    value={stats.totalTracedMarket}
                    subtext="Found in RPC/History"
                    icon={History}
                    colorClass="text-cyan-400"
                  />
                  <StatCard
                    title="Pruned Sales Recovered"
                    value={stats.totalReconstructed}
                    subtext="Reconstructed from balances"
                    icon={AlertCircle}
                    colorClass="text-amber-400"
                    highlight={stats.totalReconstructed > 0}
                  />
                  <StatCard
                    title="Total Confirmed Sold"
                    value={stats.totalCalculatedSold}
                    subtext="Guaranteed market volume"
                    icon={Coins}
                    colorClass="text-emerald-400"
                  />
                </div>

                <h2 className="text-xl 
font-semibold text-white px-2 mt-8 flex items-center gap-2">
                  <BarChart3 className="w-5 h-5 text-cyan-400" /> Sales Volume by Tranche
                </h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                  {data.pricePoints.map((point, index) => (
                    <div key={index} className="bg-slate-800/80 p-5 rounded-xl border border-slate-700 shadow flex flex-col justify-between">
                      <div 
className="text-slate-400 text-sm font-medium mb-2">Sale Price (HIVE)</div>
                      <div className="text-2xl font-mono text-cyan-400 font-bold mb-4">
                        {point.price}
                      </div>
                      <div className="pt-3 border-t border-slate-700/50">
                        <div className="text-slate-500 text-xs uppercase tracking-wider mb-1">Total Volume Sold</div>
                        <div className="text-lg font-bold text-white">
                          {point.amoun
t.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 6 })} ELIXIR
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <h2 className="text-xl font-semibold text-white px-2 mt-8 flex items-center gap-2">
                  <History className="w-5 h-5 text-emerald-400" /> Unified Sales Ledger ({data.history.length} operations)
                </h2>
                <div className="bg-slate-800 rounded-xl shadow-lg border border-slate-700 overflow-hidden flex flex-col max-h-[700px]">
                  <div className="overflow-auto flex-1">
                    <table className="w-full text-left text-sm whitespace-nowrap">
                      <thead className="bg-slate-900/90 sticky top-0 backdrop-blur-sm z-10">
                        <tr className="text-slate-300 border-b border-slate-700 uppercase tracking-wider text-xs">
                          <th className="p-4 
font-semibold">DATE</th>
                          <th className="p-4 font-semibold">TYPE</th>
                          <th className="p-4 font-semibold">BUYER / RECIPIENT</th>
                          <th className="p-4 font-semibold">MEMO / CONTEXT</th>
                          <th className="p-4 font-semibold text-right">ELIXIR</th>
                          <th className="p-4 font-semibold text-right">PRICE</th>
                          <th className="p-4 font-semibold text-right">TOTAL HIVE</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-700/50">
                        {data.history.map((row, index) => {
                          const isReconstructed = row.source === 'Rich List Reconciliation';
                          const isReward = row.type === 'DELEGATION PAYMENT';

                          return (
                            <tr key={`${row.id}-${index}`} className={`hover:bg-slate-700/35 
transition-colors ${isReconstructed ? 'bg-amber-900/10' : ''}`}>
                              <td className={`p-4 ${isReconstructed ? 'text-amber-500/70 italic' : 'text-slate-400'}`}>{row.date}</td>
                              <td className={`p-4 font-bold ${isReconstructed ? 'text-amber-400' : isReward ? 'text-purple-400' : 'text-emerald-400'}`}>{row.type}</td>
                              <td className="p-4 text-slate-200">@{row.buyer}</td>
                              <td className="p-4 text-slate-400 text-xs max-w-[200px] truncate" title={row.memo}>
                                {row.memo || 'None'}
                              </td>
                              <td className="p-4 text-right text-emerald-400 font-mono font-medium">
                                {row.quantity.toLocaleString(undefined, { minimumFractionDigits: 6, maximumFractionDigits: 6 })}
                              </td>
                              <td className="p-4 text-right 
text-slate-300 font-mono">
                                {row.price === 0 ? 'OTC' : row.price.toFixed(8)}
                              </td>
                              <td className="p-4 text-right text-cyan-400 font-mono font-medium">
                                {row.price === 0 ? '-' : row.totalHive.toFixed(8)}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
                {stats.totalReconstructed > 0 && (
                  <div className="mt-4 p-4 bg-amber-900/20 border border-amber-500/30 rounded-lg text-amber-200/80 text-sm">
                    <strong>Why do some records say "BUY (RECONSTRUCTED)"?</strong> Hive Engine permanently deletes older market transactions from their public APIs. Because we know exactly who holds tokens from the Rich List, this app mathematically calculates the missing historical purchases and reconstructs them into the ledger, ensuring you have a 100% accurate count of the supply 
sold. We assume these pruned sales were executed at the Tranche 1 price (1.0 HIVE).
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
